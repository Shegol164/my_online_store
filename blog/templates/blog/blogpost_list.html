{% extends 'blog/base.html' %}

{% block blog_content %}
<h1>Блоговые записи</h1>
<a href="{% url 'blog:create' %}" class="btn btn-primary mb-3">Создать запись</a>
<div class="row">
    {% for post in object_list %}
    <div class="col-md-6 mb-4">
        <div class="card">
            <img src="{{ post.preview.url }}" class="card-img-top" alt="{{ post.title }}">
            <div class="card-body">
                <h5 class="card-title">{{ post.title }}</h5>
                <p class="card-text">{{ post.content|truncatechars:100 }}</p>
                <div class="d-flex justify-content-between">
                    <a href="{% url 'blog:detail' post.pk %}" class="btn btn-primary">Читать</a>
                    <span class="text-muted">Просмотров: {{ post.views_count }}</span>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
