<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .business-card {
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 25px;
            margin-top: 30px;
        }
        .contact-icon {
            font-size: 1.2rem;
            margin-right: 10px;
            color: #0d6efd;
        }
        .back-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="text-center mb-4">
            <h1>Добро пожаловать в наш магазин!</h1>
            <p class="lead">Мы предлагаем лучшие товары по выгодным ценам</p>
        </div>

        <!-- Визитная карточка -->
        <div class="business-card">
            <h3 class="mb-4">Контактная информация</h3>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <p><i class="bi bi-telephone contact-icon"></i> Телефон: +7 (123) 456-78-90</p>
                    <p><i class="bi bi-envelope contact-icon"></i> Email: info@example.com</p>
                </div>
                <div class="col-md-6 mb-3">
                    <p><i class="bi bi-geo-alt contact-icon"></i> Адрес: г. Москва, ул. Примерная, 123</p>
                    <p><i class="bi bi-clock contact-icon"></i> Часы работы: Пн-Пт 9:00-18:00</p>
                </div>
            </div>
        </div>

        <!-- Кнопка назад -->
        <div class="text-center back-btn">
            <a href="#" class="btn btn-outline-primary" onclick="history.back()">
                <i class="bi bi-arrow-left"></i> Назад
            </a>
        </div>
    </div>

    <!-- Подключение Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Подключение Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
