{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Наши товары</h1>
        <a href="{% url 'catalog:product_create' %}" class="btn btn-primary">Добавить продукт</a>
    </div>
    
    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
                {% endif %}
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description|truncatechars:100 }}</p>
                    <div class="mt-auto">
                        <a href="{% url 'catalog:product_detail' pk=product.pk %}" class="btn btn-primary">Подробнее</a>
                        <a href="{% url 'catalog:product_update' pk=product.pk %}" class="btn btn-secondary">Изменить</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
